<style>
:root{--paper:#f5f4ef;--ink:#1c1c1a;--muted:#6a6860;--accent:#14775a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;display:flex;align-items:center;justify-content:center;padding:48px;position:relative}

.scene{display:block;margin:0 auto 28px;max-width:100%;height:auto}
.code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}
h1{font-weight:400;font-size:clamp(26px,4.5vw,38px);line-height:1.2;margin:0 0 22px}
a{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
a:hover,a:focus-visible{color:var(--ink)}
.nav404{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--muted)}
@media (prefers-color-scheme:dark){:root{--paper:#141413;--ink:#eceae3;--muted:#8f8d85;--accent:#3cc79c}}
:root[data-theme=light]{--paper:#f5f4ef;--ink:#1c1c1a;--muted:#6a6860;--accent:#14775a;color-scheme:light}
:root[data-theme=dark]{--paper:#141413;--ink:#eceae3;--muted:#8f8d85;--accent:#3cc79c;color-scheme:dark}
.theme-sw{position:fixed;bottom:44px;left:50%;margin-left:-22px;width:44px;height:22px;padding:0;border:1px solid var(--muted);border-radius:11px;background:none;cursor:pointer;background:color-mix(in srgb,var(--muted) 25%,transparent)}
.theme-sw .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:#ef9f27;transition:transform .15s ease}
.theme-sw .moon,:root[data-theme=dark] .theme-sw .sun{display:none}
:root[data-theme=dark] .theme-sw .moon{display:block}
:root[data-theme=dark] .theme-sw .knob{transform:translateX(22px);color:var(--ink)}
.theme-sw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.theme-sw .knob{transition:none}}
@media (max-width:1099px){.theme-sw{margin-left:-20px;width:40px;height:20px}.theme-sw .knob{width:14px;height:14px}:root[data-theme=dark] .theme-sw .knob{transform:translateX(20px)}}
</style>

<script>
(function(){var b=document.getElementById("theme-toggle"),m=document.querySelector('meta[name=theme-color]'),q=matchMedia("(prefers-color-scheme: dark)"),chosen=false;
try{chosen=!!localStorage.getItem("portfolio-theme")}catch(e){}
function show(){var k=d.dataset.theme==="dark";b.setAttribute("aria-checked",k);b.title="switch to "+(k?"light":"dark");if(m)m.content=k?"#141413":"#f5f4ef"}
function set(t){d.dataset.theme=t;show()}
b.addEventListener("click",function(){chosen=true;var t=d.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("portfolio-theme",t)}catch(e){}set(t)});
